function sceneIdle(c, tau) { paper(c, F.BG, null, 31); drawFace(c, tau, F.drawingAt(Math.floor(tau * 24))); F.frame(c); }

  // overlapping like books on a shelf; the ones at the edges are bigger

  ['ipod', .55, .88, 230, -.1], ['celsius', .65, .84, 260, .15], ['violin', .76, .82, 340, .35], ['nugget', .86, .87, 240, -.45], ['pencil', .94, .83, 300, -.88]];   // sitting a little past the bottom edge
const NOTES = {                                               // what each object says when clicked

  toy: 'my hirono collection is getting out of hand', mic: 'will never say no to karaoke', ipod: 'a little bit of everything on my playlist',

// the corgi crosses left to right along the lane above the objects, exits on the right, and comes back in from the

const LANES = W < H ? [.58, .11] : [.56, .145], SPEED = 230 * Math.min(1, W / 1920 * 1.6), CROSS = (W + 0.24 * W) / SPEED;      // seconds for one crossing, edge to edge

// portrait: the objects in two rows along the bottom, the text block higher with narrower lines
const OBJECTS_P = [['guitar2', .13, .76, 1.0, -.30], ['boba', .33, .80, .62, .12], ['cheese', .52, .82, .55, -.2], ['toy', .70, .78, .72, .08], ['mic', .89, .80, .8, -.62],

function panelAbout(c, t) {

  { const kk = easeOut(clamp((t - .5) / .7, 0, 1)); if (kk > 0) { c.save(); c.globalAlpha = kk; const word = 'ABOUT ME', sz = P ? W * .072 : 92, gap = sz * .09, wsp = sz * .55; let tot = 0; for (const ch of word) tot += ch === ' ' ? wsp : sz + gap; let x = CX - tot / 2; let i = 0;
